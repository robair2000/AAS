services:
  - type: worker
    name: arb-scanner
    runtime: node
    region: frankfurt # set at creation; Render can't move an existing service
    plan: starter # background workers have no free tier on Render
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        sync: false # paste your Alchemy / Infura / QuickNode Arbitrum URL in the dashboard
      - key: SCAN_INTERVAL_MS
        value: "15000"
      - key: MIN_PROFIT_USD
        value: "1"
      - key: MIN_LIQ_USD
        value: "5000"
      - key: MAX_AGE_DAYS
        value: "90"
      - key: DISCOVERY_EVERY_MIN
        value: "15"
      - key: SUMMARY_EVERY_MIN
        value: "60"
      - key: WATCH_TOKENS
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
